apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-node-labeler
    app.kubernetes.io/managed-by: kustomize
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - labeler.arsolitt.tech
  resources:
  - labelmappings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - labeler.arsolitt.tech
  resources:
  - labelmappings/finalizers
  verbs:
  - update
- apiGroups:
  - labeler.arsolitt.tech
  resources:
  - labelmappings/status
  verbs:
  - get
  - patch
  - update
